[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "nq-reversion"
version = "0.1.0"
description = "Research harness for intraday NQ mean-reversion hypotheses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
]

[project.optional-dependencies]
moomoo = ["moomoo-api==10.11.7108"]
test = ["pytest>=8.3"]

[project.scripts]
nq-reversion = "nq_reversion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
