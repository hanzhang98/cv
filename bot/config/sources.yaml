      tags: [markets, noise]
      noise_bias: 0.35
    - handle: "WSBChairman"
      weight: 0.25
      tags: [retail, noise]
      noise_bias: 0.7
  queries:
    - '("hedge fund" OR 13F OR positioning OR "crowded trade" OR "prime broker") (long OR short OR equity)'
    - '(catalyst OR headwind OR thesis) (earnings OR guidance OR valuation) (stock OR equity OR market)'
    - '(CXMT OR HBM OR "memory pricing") (stock OR semiconductor OR Micron)'
    - '(Kimi OR Moonshot OR DeepSeek) (AI OR LLM OR market OR stock)'
    - '(Fed OR "rate cut" OR "soft landing" OR stagflation) (markets OR stocks OR bonds)'

scoring:
  min_score_to_surface: 0.35
  noise_penalty_cap: 0.55
  source_weight_floor: 0.2
  max_items_per_digest: 12
  # Hard drop anything older than this (markets move fast).
  lookback_hours: 336  # 14 days
  # Extra score for fresher posts inside the window.
  recency_full_boost_hours: 48   # full boost if <= 2 days old
  recency_half_life_hours: 168   # boost fades over ~7 days
  recency_max_boost: 0.18
