# Curated starting set. Add/remove freely.
# Substack feeds are public RSS — primary starter source.
# Twitter accounts are used with the API when TWITTER_BEARER_TOKEN is set;
# otherwise demo fixtures + optional Nitter-style RSS mirrors are used.

substack:
  # Finance / markets research newsletters (examples; verify feeds stay live)
  - name: "The Diff"
    url: "https://thediff.co/feed"
    weight: 1.0
    tags: [markets, tech]
  - name: "Stratechery"
    url: "https://stratechery.com/feed/"
    weight: 1.0
    tags: [tech, strategy]
  - name: "Doomberg"
    url: "https://doomberg.substack.com/feed"
    weight: 0.9
    tags: [energy, commodities]
  - name: "Semianalysis"
    url: "https://www.semianalysis.com/feed"
    weight: 1.1
    tags: [semiconductors, ai]
  - name: "Asianometry"
    url: "https://www.asianometry.com/feed"
    weight: 1.0
    tags: [semiconductors, china]
  - name: "ChinaTalk"
    url: "https://www.chinatalk.media/feed"
    weight: 0.95
    tags: [china, policy]
  - name: "Net Interest"
    url: "https://netinterest.substack.com/feed"
    weight: 0.95
    tags: [finance, banks]
  - name: "The Daily Dirtnap"
    url: "https://dirtnapcap.substack.com/feed"
    weight: 0.85
    tags: [markets, shorts]
  - name: "Compounding Quality"
    url: "https://www.compoundingquality.net/feed"
    weight: 0.8
    tags: [quality, equities]
  - name: "Investing 101"
    url: "https://investing101.substack.com/feed"
    weight: 0.7
    tags: [general]

twitter:
  # Buy-side / research-leaning handles (no retail meme accounts in core list)
  accounts:
    - handle: "semianalysis_"
      weight: 1.1
      tags: [semiconductors, ai]
    - handle: "dylan522p"
      weight: 1.1
      tags: [semiconductors, ai]
    - handle: "Jukanlosreve"
      weight: 0.9
      tags: [china, semiconductors]
    - handle: "TechieOlga"
      weight: 0.85
      tags: [china, tech]
    - handle: "macroalf"
      weight: 0.9
      tags: [macro, positioning]
    - handle: "hmeisenzahl"
      weight: 0.85
      tags: [markets]
    - handle: "Brad_Setser"
      weight: 0.9
      tags: [china, policy]
    - handle: "zerohedge"
      weight: 0.45
      tags: [markets, noise]
      noise_bias: 0.35
    - handle: "WSBmod"
      weight: 0.25
      tags: [retail, noise]
      noise_bias: 0.7
  # Search queries for thematic scans (Twitter API recent search)
  queries:
    - '(CXMT OR HBM OR "memory pricing") (stock OR semiconductor OR Micron)'
    - '(Kimi OR Moonshot OR DeepSeek) (AI OR LLM OR model)'
    - '("hedge fund" OR 13F OR positioning OR "crowded trade") (long OR short)'
    - '(catalyst OR headwind) (earnings OR guidance) (stock OR equity)'

scoring:
  min_score_to_surface: 0.35
  noise_penalty_cap: 0.55   # never cut score by more than this from noise alone
  source_weight_floor: 0.2
  max_items_per_digest: 12
  # 0 = no date filter (RSS already returns each feed's latest posts).
  # Set e.g. 168 for a 7-day Twitter-focused window later.
  lookback_hours: 0