# Curated market-leaning source set.
# Prefer custom-domain RSS — bare *.substack.com/feed often 403s from datacenter IPs.
# Picked from widely cited finance newsletter roundups (e.g. Edwin Dorsey toolkit,
# Behind the Balance Sheet Substack rankings) + feeds we can actually fetch live.
# Twitter accounts used when TWITTER_BEARER_TOKEN is set; else fixtures fill gaps.

